[project]
name = "kb-mcp"
version = "0.1.0"
description = "Read-only MCP server over a personal AI-learning knowledge graph (Obsidian vault)."
requires-python = ">=3.10"
dependencies = ["mcp>=1.29,<2", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["test_server.py"]
